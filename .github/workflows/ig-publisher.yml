# IG-Build und Veröffentlichung auf GitHub Pages.
#
# Bei jedem Push laufen SUSHI und der HL7 IG Publisher. Der Stand von main wird
# direkt aus dem Workflow als Pages-Artefakt veröffentlicht (kein gh-pages-Branch);
# auf anderen Branches wird nur gebaut und geprüft.
#
# Einmalige Einrichtung: Settings -> Pages -> Source: "GitHub Actions".
#
# Alle Actions sind auf Commit-SHAs gepinnt; IG Publisher, SUSHI und Jekyll sind
# im env-Block versioniert, der Publisher zusätzlich per SHA-256 geprüft.
name: IG build and publish

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISHER_VERSION: "2.3.4"
  PUBLISHER_SHA256: "970922c12eb583bfb4cb6121584b922a236d5904e36413e3545d2fbc248f8e2b"
  SUSHI_VERSION: "3.20.1"
  JEKYLL_VERSION: "4.4.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Java (for the IG Publisher)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Ruby (for Jekyll)
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Install Jekyll
        run: gem install jekyll -v "${JEKYLL_VERSION}"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Check that generated mapping files are up to date
        run: |
          python3 scripts/build_mapping.py
          git diff --exit-code -- input/pagecontent/mapping.md input/fsh/generated-logical-model.fsh input/fsh/generated-vs-laborparameter.fsh

      - name: SUSHI compile
        run: |
          set -euo pipefail
          npm install --global "fsh-sushi@${SUSHI_VERSION}"
          sushi build .
          test -d fsh-generated/resources

      - name: Build IG with the pinned IG Publisher
        run: |
          set -euo pipefail
          publisher_url="https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"
          curl --fail --location --silent --show-error "${publisher_url}" --output "${RUNNER_TEMP}/publisher.jar"
          echo "${PUBLISHER_SHA256}  ${RUNNER_TEMP}/publisher.jar" | sha256sum --check
          java -Xmx6g -jar "${RUNNER_TEMP}/publisher.jar" -ig ig.ini -tx https://tx.fhir.org
          test -s output/index.html
          jq empty output/qa.json

      - name: QA summary
        run: |
          {
            echo "### IG Publisher QA"
            jq -r '"Errors: \(.errs) · Warnings: \(.warnings) · Hints: \(.hints)"' output/qa.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Pages artifact
        if: ${{ github.ref_name == 'main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.ref_name == 'main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nie zwei Deployments gleichzeitig; ein laufendes wird nicht abgebrochen.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
